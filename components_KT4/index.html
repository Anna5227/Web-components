<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="app">
    <div class="expense-card">
      <header class="expense-card__header">
        <h1>Калькулятор расходов</h1>
        <p class="expense-card__subtitle">Управляйте своими тратами</p>
      </header>

      <form class="expense-form" id="expense-form" autocomplete="off">
        <div class="expense-form__group">
          <label for="expense-name">Название расхода</label>
          <input
            type="text"
            id="expense-name"
            name="name"
            placeholder="Например: Продукты"
            required
          />
        </div>

        <div class="expense-form__group">
          <label for="expense-amount">Сумма (₽)</label>
          <input
            type="number"
            id="expense-amount"
            name="amount"
            placeholder="0.00"
            min="0.01"
            step="0.01"
            required
          />
        </div>

        <button type="submit" class="btn btn--primary">Добавить расход</button>
      </form>

      <div class="expense-total">
        <span class="expense-total__label">Итого:</span>
        <span class="expense-total__value" id="total-amount">0.00 ₽</span>
      </div>

      <ul class="expense-list" id="expense-list">
      </ul>

      <p class="expense-empty" id="expense-empty">Пока нет расходов. Добавьте первый!</p>

    <script src="./script.js"></script>
</body>
</html>
